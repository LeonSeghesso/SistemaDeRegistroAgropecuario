<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    
    
</head>
<body>

    <nav class="navbar border-bottom border-body" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="#">Agro System</a>
            <button id="btn_obtener" class="btn btn-caravana" type="button">Mostrar Registros</button>
        </div>
    </nav>

    <main class="container py-4">

        <header class="encabezado mb-4">
            <h1>Control de pesajes</h1>
            <p>Cargá cada animal y registrá su peso a lo largo del tiempo.</p>
        </header>

        <div id="listado"></div>

        <div class="row g-4 mb-5">

            <section class="col-md-6">
                <div class="panel">
                    <h2>Registrar animal</h2>
                    <p class="ayuda">Datos del animal cuando ingresa a la hacienda.</p>

                    <form id="formAnimal">
                        <div class="mb-3">
                            <label for="raza" class="form-label">Raza</label>
                            <select class="form-select" id="raza" name="raza" required>
                                <option value="" selected disabled>Seleccione una raza</option>
                                <option value="Holando Argentino">Holando Argentino</option>
                                <option value="Angus">Angus</option>
                                <option value="Hereford">Hereford</option>
                                <option value="Jersey">Jersey</option>
                                <option value="Brangus">Brangus</option>
                                <option value="Brahman">Brahman</option>
                                <option value="Charolais">Charolais</option>
                                <option value="Limousin">Limousin</option>
                                <option value="Criollo">Criollo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso inicial</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" id="peso" name="peso" required>
                                <span class="input-group-text">kg</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        </div>

                        <button type="submit" class="btn btn-agro">Guardar animal</button>
                    </form>

                    <div id="resultado" class="mt-4"></div>
                </div>
            </section>

            <section class="col-md-6">
                <div class="panel panel-pesaje">
                    <h2>Registrar pesaje</h2>
                    <p class="ayuda">Sumá un nuevo peso a un animal ya cargado.</p>

                    <form id="formPesaje">
                        <div class="mb-3">
                            <label for="animal_pesaje" class="form-label">Animal</label>
                            <select class="form-select" id="animal_pesaje" name="id_animal" required>
                                <option value="" selected disabled>Seleccione un animal</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="peso_pesaje" class="form-label">Peso</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" id="peso_pesaje" name="peso" required>
                                <span class="input-group-text">kg</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_pesaje" class="form-label">Fecha de pesaje</label>
                            <input type="date" class="form-control" id="fecha_pesaje" name="fecha_pesaje" required>
                        </div>

                        <button type="submit" class="btn btn-caravana">Registrar pesaje</button>
                    </form>

                    <div id="resultadoPesaje" class="mt-4"></div>
                </div>
            </section>

        </div>
    </main>

    <!-- Modal historial de pesajes -->
    <div class="modal fade" id="modalHistorial" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Historial de Pesajes</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="contenidoHistorial">
                    Cargando...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/GuardarAnimal.js"></script>
    <script src="js/Listados.js"></script>
    <script src="js/GuardarPesaje.js"></script>

</body>
</html>
